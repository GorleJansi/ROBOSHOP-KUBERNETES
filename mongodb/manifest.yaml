apiVersion: storage.k8s.io/v1 
kind: StorageClass
metadata:
  name: "mongodb-storageclass"
reclaimPolicy: Retain                # Keeps the EBS volume after the PVC is deleted; data is not deleted automatically.
provisioner: ebs.csi.aws.com         # Uses the AWS EBS CSI driver to create EBS volumes dynamically.
volumeBindingMode: WaitForFirstConsumer  
---
apiVersion: v1
kind: Service
metadata:
  name: "clusterip-service"
  namespace: roboshop
spec:
  type: ClusterIP
  selector:   
    author: jansi
    project: "mongodb-roboshop"
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017  

---

apiVersion: v1
kind: Service
metadata:
  name: "mongodb-headless"
  namespace: roboshop
spec:
  clusterIP: None
  selector:   
    author: jansi
    project: "mongodb-roboshop"
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017  

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "mongodb-statefulset"
  namespace: roboshop
  labels:
    env: dev
spec:
  replicas: 2
  serviceName: "mongodb-headless"
  selector:
    matchLabels:
      author: jansi
      project: "mongodb-roboshop"
  template:
    metadata:
      labels:
        author: jansi
        project: "mongodb-roboshop"            
    spec:
  replicas: 2
  serviceName: "mysql-headless"
  selector:
    matchLabels:
      project: roboshop
      component: mysql
  template:
    metadata:
      labels:
        project: roboshop
        component: mysql
    spec:
      containers:
        - name: "mysql-statefulset-c"
          image: jansigorle03/mysql:v1
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: "mysql-volume"
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: "mysql-volume"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "mysql-storageclass"
        resources:
          requests:
            storage: 2Gi