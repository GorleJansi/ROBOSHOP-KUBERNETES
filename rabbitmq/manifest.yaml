---

apiVersion: v1
kind: Service
metadata:
  name: "rabbitmq-clusterip"
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: rabbitmq
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672
---

apiVersion: v1
kind: Service
metadata:
  name: "rabbitmq-headless"
  namespace: roboshop
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: rabbitmq
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672

---

apiVersion: storage.k8s.io/v1 
kind: StorageClass
metadata:
  name: "rabbitmq-storageclass"
reclaimPolicy: Retain                # Keeps the EBS volume after the PVC is deleted; data is not deleted automatically.
provisioner: ebs.csi.aws.com         # Uses the AWS EBS CSI driver to create EBS volumes dynamically.
volumeBindingMode: WaitForFirstConsumer


---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "rabbitmq-statefulset"
  namespace: roboshop
spec:
  replicas: 2
  serviceName: "rabbitmq-headless"
  selector:
    matchLabels:
      project: roboshop
      component: rabbitmq
  template:
    metadata:
      labels:
        project: roboshop
        component: rabbitmq
    spec:
      containers:
        - name: "rabbitmq-statefulset-c"
          image: jansigorle03/rabbitmq:v1
          ports:
            - containerPort: 3306
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: roboshop
            - name: RABBITMQ_DEFAULT_PASS
              value: roboshop123
          volumeMounts:
            - name: "rabbitmq-volume"
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: "rabbitmq-volume"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "rabbitmq-storageclass"
        resources:
          requests:
            storage: 2Gi

